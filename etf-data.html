<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETF Data</title>
    <script>
        async function fetchData() {
            const response = await fetch('https://mis.twse.com.tw/stock/data/all_etf.txt');
            const data = await response.text();
            document.getElementById('etf-data').textContent = data;
        }
        window.onload = fetchData;
    </script>
</head>
<body>
    <h1>ETF Data</h1>
    <pre id="etf-data">Loading data...</pre>
</body>
</html>
