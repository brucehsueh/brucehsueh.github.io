<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETF Data</title>
    <script>
        async function fetchETFData() {
            const proxyUrl = 'https://cors-anywhere.herokuapp.com/'; // CORS proxy
            const targetUrl = 'https://mis.twse.com.tw/stock/data/all_etf.txt';
            try {
                const response = await fetch(proxyUrl + targetUrl);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.text();
                document.getElementById('etf-data').textContent = data;
            } catch (error) {
                document.getElementById('etf-data').textContent = `Error fetching ETF data: ${error.message}`;
            }
        }

        window.onload = fetchETFData;
    </script>
</head>
<body>
    <h1>ETF Data</h1>
    <pre id="etf-data">Loading...</pre>
</body>
</html>
